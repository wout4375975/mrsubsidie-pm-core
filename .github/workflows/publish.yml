name: Core CI and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: TypeScript check
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build package
        run: pnpm build
      - name: Verify package outputs
        run: pnpm verify:package
      - name: Verify git release artifacts
        run: pnpm verify:git-artifact
      - name: Verify packed tarball
        run: pnpm pack:check

  publish:
    name: Publish GitHub Package
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@wout4375975"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate publish token
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo "NPM_PUBLISH_TOKEN ontbreekt of is niet beschikbaar voor deze workflow." >&2
            exit 1
          }
      - name: Verify release artifact
        run: pnpm release:check
      - name: Prevent version overwrite
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Versie ${package_name}@${package_version} bestaat al en is immutable." >&2
            exit 1
          fi
      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
